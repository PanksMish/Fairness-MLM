# Default configuration for ADAPT-BTS dataset building and training.
#
# IMPORTANT: the manuscript states experiments cover "101 languages" and
# gives per-family counts (Fig. 1b: 38 Indo-European, 18 Niger-Congo, 14
# Sino-Tibetan, 12 Afroasiatic, 11 Austronesian, 8 Dravidian = 101 total)
# and per-resource-tier counts (Table 2: HR=18, MR=37, LR=46), but does
# NOT publish the full list of all 101 ISO language codes anywhere in the
# text. Table 8 (Appendix B) only lists ~85 example languages as a
# representative sample, not the complete set.
#
# The list below is a STARTING POINT built from Table 8's examples plus
# WikiAnn/XTREME-covered languages, categorized by the Sec 3.1 thresholds.
# It is NOT guaranteed to reproduce the manuscript's exact 101-language
# set or family/resource-tier breakdown -- you should audit and adjust
# this list (particularly resource-tier assignments, which depend on
# actual CC100 token counts you'd need to measure yourself per
# resource_category() in datasets/language_filter.py) before treating
# results as comparable to the paper's Table 2/5/8.

languages:
  # High-resource (paper: n=18)
  high_resource:
    - en  # English
    - de  # German
    - fr  # French
    - es  # Spanish
    - it  # Italian
    - pt  # Portuguese
    - ru  # Russian
    - zh  # Chinese
    - ja  # Japanese
    - ko  # Korean
    - nl  # Dutch
    - sv  # Swedish
    - pl  # Polish
    - ar  # Arabic
    - tr  # Turkish
    - vi  # Vietnamese
    - th  # Thai
    - id  # Indonesian

  # Medium-resource (paper: n=37) -- partial list, extend as needed
  medium_resource:
