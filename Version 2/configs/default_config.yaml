  # Low-resource (paper: n=46)
  low_resource:
    - eu  # Basque
    - gl  # Galician
    - cy  # Welsh
    - ga  # Irish
    - mt  # Maltese
    - lb  # Luxembourgish
    - ha  # Hausa
    - yo  # Yoruba
    - ig  # Igbo
    - sn  # Shona
    - km  # Khmer
    - lo  # Lao
    - mn  # Mongolian
    - ti  # Tigrinya
    - ps  # Pashto
    - ku  # Kurdish
    - sq  # Albanian
    - bs  # Bosnian
    - mk  # Macedonian
    - hy  # Armenian
    - az  # Azerbaijani
    - be  # Belarusian
    - ca  # Catalan
    # --- extended to close the gap toward n=46 (2026-07 update) ---
    # All 23 below are real ISO 639-1 codes, verified present in
    # datasets/download_cc100.py's CC100_VALID_CODES list (required,
    # since these languages have no real labeled sentiment source and
    # depend entirely on datasets/build_weak_sentiment.py's CC100 +
    # NRC-lexicon weak-supervision pipeline -- see README's warning
    # section on what "low-resource" means for these specifically:
    # real unlabeled text, WEAK heuristic labels, not gold annotations).
    - as  # Assamese (Indo-Aryan)
    - br  # Breton (Celtic)
    - ff  # Fulah (Niger-Congo)
    - fy  # Western Frisian (Germanic)
    - gd  # Scottish Gaelic (Celtic)
    - gn  # Guarani (Tupian)
    - ht  # Haitian Creole
    - jv  # Javanese (Austronesian)
    - ky  # Kyrgyz (Turkic)
    - lg  # Luganda (Niger-Congo)
    - li  # Limburgish (Germanic)
    - ln  # Lingala (Niger-Congo)
    - mg  # Malagasy (Austronesian)
    - ml  # Malayalam (Dravidian)
    - my  # Burmese (Sino-Tibetan)
    - om  # Oromo (Cushitic/Afroasiatic)
    - or  # Odia (Indo-Aryan)
    - pa  # Punjabi (Indo-Aryan)
    - qu  # Quechua (Quechuan)
    - sa  # Sanskrit (Indo-Aryan)
    - sd  # Sindhi (Indo-Aryan)
    - su  # Sundanese (Austronesian)
    - wo  # Wolof (Niger-Congo)

