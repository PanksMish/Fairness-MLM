  # WikiAnn/XTREME does not cover every language in `all`; NER should be
  # restricted to whatever download_wikiann.py's --languages run actually
  # confirms is available (it logs skipped languages to
  # data/processed/ner/_missing_languages.json). Sec 5.2: "NER evaluation
  # is performed only on the subset of languages present in the
  # XTREME/WikiAnn dataset."
  ner_subset: null  # set to null to mean "use `all`, minus whatever WikiAnn is missing"

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  sentiment_processed: data/processed/sentiment
  ner_processed: data/processed/ner

split:
  train: 0.8
  validation: 0.1
  test: 0.1
  seed: 42

resource_thresholds:
  # Sec 3.1: HR: T_l > 1e9, MR: 1e8 < T_l <= 1e9, LR: T_l <= 1e8
  hr_min_tokens: 1.0e9
  mr_min_tokens: 1.0e8
